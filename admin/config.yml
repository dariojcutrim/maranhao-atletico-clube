# =====================================================================
# Configuração do Painel de Edição (Sveltia CMS) — Maranhão Atlético Clube
# Cada campo tem um rótulo claro (label) e uma dica (hint) explicando
# o que ele muda e onde aparece no site.
# =====================================================================

backend:
  name: github
  repo: dariojcutrim/maranhao-atletico-clube
  branch: main

# Onde as novas imagens enviadas pelo painel ficam guardadas
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# Mensagens dos commits (histórico de alterações)
site_url: "https://maranhaoatleticoclubebr.com.br"
locale: "pt"

collections:
  # ================================================================ HOME
  - name: home
    label: "🏠 Página Inicial"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Conteúdo da Página Inicial"
        file: "content/home.yaml"
        description: "Tudo o que aparece na primeira página do site."
        fields:
          - label: "Destaque principal (topo com a foto)"
            name: hero
            widget: object
            fields:
              - { label: "Título — linha 1", name: title_line1, widget: string, hint: "Primeira linha do título grande sobre a foto. Ex.: História, tradição" }
              - { label: "Título — ligação", name: title_line2_prefix, widget: string, hint: "Palavrinha de ligação no começo da 2ª linha. Ex.: e" }
              - { label: "Título — palavra em vermelho", name: title_accent, widget: string, hint: "Última palavra do título, que aparece em VERMELHO. Ex.: conquistas" }
              - { label: "Frase abaixo do título", name: subtitle, widget: text, hint: "Frase de apresentação logo abaixo do título grande." }
              - label: "Fotos que passam no fundo (carrossel)"
                name: slides
                widget: list
                label_singular: "Foto"
                summary: "{{fields.src}}"
                thumbnail: "src"
                hint: "As fotos que vão trocando sozinhas no fundo do topo. Cada item mostra a MINIATURA da foto atual. Adicione, remova ou arraste para reordenar."
                fields:
                  - { label: "Foto", name: src, widget: image }
          - label: "Faixa de números (conquistas)"
            name: stats
            widget: list
            label_singular: "Número"
            summary: "{{fields.number}} — {{fields.label}}"
            hint: "Os 4 números azuis (1932, 18, 1979, +90)."
            fields:
              - { label: "Número", name: number, widget: string, hint: "O número em si. Ex.: 1932 ou 18" }
              - { label: "Texto abaixo do número", name: label, widget: string, hint: "Descrição embaixo do número. Ex.: Títulos maranhenses" }
              - { label: "Animar contando? (opcional)", name: count, widget: number, required: false, hint: "Preencha SÓ se quiser o efeito de contagem crescente (ex.: 18). Deixe vazio para anos como 1932." }
              - { label: "Símbolo antes (opcional)", name: prefix, widget: string, required: false, hint: 'Ex.: + (para mostrar "+90"). Deixe vazio se não usar.' }
              - { label: "Texto pequeno depois (opcional)", name: suffix, widget: string, required: false, hint: 'Ex.: anos (para mostrar "+90 anos"). Deixe vazio se não usar.' }
          - label: "Seção SOBRE"
            name: sobre
            widget: object
            fields:
              - { label: "Título da seção", name: title, widget: string, hint: 'Título azul da seção. Ex.: Sobre' }
              - { label: "Parágrafos do texto", name: paragraphs, widget: list, field: { label: "Parágrafo", name: p, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }, hint: "Cada item é um parágrafo. Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
              - { label: "Fotos da colagem (lado direito)", name: images, widget: list, summary: "{{fields.alt}}", thumbnail: "src", fields: [ { label: "Foto", name: src, widget: image }, { label: "Descrição da foto", name: alt, widget: string, hint: "Texto que descreve a foto (acessibilidade)." } ], hint: "As 3 fotos sobrepostas ao lado do texto." }
          - label: "Seção Patrocinadores (textos)"
            name: sponsors
            widget: object
            hint: "Os logos ficam na aba 🤝 Patrocinadores. Aqui só os textos."
            fields:
              - { label: "Título da seção", name: title, widget: string }
              - { label: "Texto do botão", name: cta, widget: string, hint: 'Botão azul. Ex.: Quero ser um patrocinador' }
          - label: "Seção Apoio"
            name: apoio
            widget: object
            fields:
              - { label: "Título", name: title, widget: string, hint: 'Ex.: Apoio:' }
              - { label: "Lista de apoiadores", name: items, widget: list, field: { label: "Apoiador", name: item, widget: string }, hint: "Nomes que aparecem separados por • no final da home." }
          - label: "SEO (título e descrição no Google)"
            name: meta
            widget: object
            fields:
              - { label: "Título da aba/Google", name: title, widget: string, hint: "Aparece na aba do navegador e nos resultados de busca." }
              - { label: "Descrição no Google", name: description, widget: text, hint: "Texto curto que aparece embaixo do título nos resultados de busca." }

  # ========================================================= PATROCINADORES
  - name: sponsors
    label: "🤝 Patrocinadores"
    delete: false
    editor: { preview: false }
    files:
      - name: lista
        label: "Logos dos Patrocinadores"
        file: "content/sponsors.yaml"
        description: "Os logos que aparecem na faixa de patrocinadores da home."
        fields:
          - label: "Patrocinadores"
            name: items
            widget: list
            label_singular: "Patrocinador"
            summary: "{{fields.name}}"
            thumbnail: "logo"
            hint: "A ordem aqui é a ordem no site. Arraste para reordenar."
            fields:
              - { label: "Nome", name: name, widget: string, hint: "Nome da empresa (usado para acessibilidade)." }
              - { label: "Logo", name: logo, widget: image, hint: "Imagem do logo. Prefira PNG com fundo transparente." }

  # ============================================================== DIRETORIA
  - name: diretoria
    label: "👔 Diretoria"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Diretoria"
        file: "content/diretoria.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string }
          - { label: "Texto de introdução", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Parágrafo no topo. Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - label: "Membros da diretoria"
            name: members
            widget: list
            label_singular: "Membro"
            summary: "{{fields.role}}: {{fields.name}}"
            thumbnail: "photo"
            fields:
              - { label: "Foto", name: photo, widget: image, required: false, hint: "Foto da pessoa (retrato vertical fica melhor). Pode ser arte promocional do clube." }
              - { label: "Cargo", name: role, widget: string, hint: "Ex.: Presidente, Auxiliar Técnico" }
              - { label: "Nome da pessoa", name: name, widget: string, hint: "Nome completo de quem ocupa o cargo." }
              - { label: "Nacionalidade", name: nationality, widget: string, required: false, hint: "Ex.: Brasileiro" }

  # ================================================================== ELENCO
  - name: elenco
    label: "⚽ Elenco"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Elenco"
        file: "content/elenco.yaml"
        description: "Jogadores agrupados por posição. Adicione/edite grupos (Goleiros, Defensores...) e, dentro de cada grupo, os jogadores."
        fields:
          - { label: "Título da página", name: title, widget: string }
          - { label: "Texto de introdução", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Parágrafo no topo. Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - label: "Grupos por posição"
            name: groups
            widget: list
            label_singular: "Posição"
            summary: "{{fields.position}}"
            fields:
              - { label: "Posição (título do grupo)", name: position, widget: string, hint: "Ex.: Goleiros, Defensores, Meio-campistas, Atacantes" }
              - label: "Jogadores"
                name: players
                widget: list
                label_singular: "Jogador"
                summary: "{{fields.name}}"
                thumbnail: "photo"
                fields:
                  - { label: "Foto", name: photo, widget: image, required: false, hint: "Foto do jogador (retrato vertical fica melhor). Pode ser arte do clube." }
                  - { label: "Nome", name: name, widget: string, hint: "Ex.: Jefferson Henrique" }
                  - { label: "Função (comissão técnica)", name: role, widget: string, required: false, hint: "Só para a comissão técnica. Ex.: Preparador Físico, Fisioterapeuta. Deixe vazio para jogadores." }
                  - { label: "Número da camisa", name: number, widget: string, required: false, hint: "Ex.: 12 — deixe vazio se não tiver." }
                  - { label: "Nacionalidade", name: nationality, widget: string, required: false, hint: "Ex.: Brasileiro" }
          - label: "SEO (aba do navegador / compartilhamento)"
            name: meta
            widget: object
            fields:
              - { label: "Título da aba", name: title, widget: string }
              - { label: "Descrição", name: description, widget: text }

  # ================================================================ CONTATO
  - name: contato
    label: "📞 Contato"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Fale Conosco"
        file: "content/contato.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string, hint: 'Ex.: Fale Conosco' }
          - { label: "Endereço", name: address, widget: string, hint: "Endereço da sede do clube." }
          - { label: "Telefone", name: phone, widget: string, hint: "Ex.: (98) 99999-9999 / WhatsApp" }
          - { label: "Horário de atendimento", name: hours, widget: string, hint: "Ex.: De segunda a sexta / 9h às 17h" }
          - { label: "Observação do horário", name: hours_note, widget: string, hint: "Texto pequeno em itálico abaixo do horário." }
          - { label: "E-mail", name: email, widget: string, hint: "E-mail de contato. Ex.: contato@seuclube.com.br" }

  # ============================================================ REDES/RODAPÉ
  - name: geral
    label: "⚙️ Geral (rodapé e redes)"
    delete: false
    editor: { preview: false }
    files:
      - name: site
        label: "Dados gerais do site"
        file: "content/site.yaml"
        description: "Aparece no topo e no rodapé de TODAS as páginas."
        fields:
          - label: "Identidade (topo do site)"
            name: brand
            widget: object
            fields:
              - { label: "Nome curto", name: name, widget: string, hint: "Ao lado do escudo, no topo. Ex.: Maranhão A.C." }
              - { label: "Linha abaixo do nome", name: subtitle, widget: string, hint: "Texto pequeno embaixo. Ex.: Atlético Clube" }
              - { label: "Nome completo (rodapé)", name: full_name, widget: string, hint: "Usado no © do rodapé." }
          - { label: "Ano do rodapé", name: copyright_year, widget: number, hint: "Ano que aparece no © do rodapé." }
          - label: "Rodapé"
            name: footer
            widget: object
            fields:
              - { label: "Frase do rodapé", name: text, widget: text, hint: "Frase curta sobre o clube no rodapé de todas as páginas." }
          - label: "Redes sociais e WhatsApp"
            name: social
            widget: object
            hint: "Afeta os ícones do rodapé, o botão verde flutuante e o botão 'Loja' do menu."
            fields:
              - { label: "Link do WhatsApp", name: whatsapp, widget: string, hint: "Link completo. Ex.: https://wa.me/5598999999999 (55 + DDD + número). Muda o botão flutuante e o ícone do rodapé." }
              - { label: "Link do Instagram", name: instagram, widget: string, hint: "Ex.: https://instagram.com/seuperfil" }
              - { label: "Link do YouTube", name: youtube, widget: string, hint: "Ex.: https://youtube.com/@seucanal" }
              - { label: "E-mail (link)", name: email, widget: string, hint: "Ex.: mailto:contato@seuclube.com.br" }
              - { label: "Link da Loja", name: store, widget: string, hint: "Loja oficial. Aparece como botão 'Loja' no menu do topo. Ex.: https://minhaloja.com.br" }

  # ================================================================ PROJETOS
  - name: projetos
    label: "📋 Projetos"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Projetos"
        file: "content/projetos.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string }
          - label: "Projetos"
            name: items
            widget: list
            label_singular: "Projeto"
            summary: "{{fields.title}}"
            thumbnail: "image"
            fields:
              - { label: "Nome do projeto", name: title, widget: string }
              - { label: "Foto", name: image, widget: image }
              - { label: "Descrição da foto", name: image_alt, widget: string, hint: "Texto de acessibilidade da foto." }
              - { label: "Foto à direita?", name: reverse, widget: boolean, default: false, hint: "Ligado = foto à direita; desligado = foto à esquerda. (Alterne para intercalar.)" }
              - { label: "Ajuste do recorte da foto (opcional)", name: image_position, widget: string, required: false, hint: 'Avançado. Ex.: center 18% para subir o recorte. Deixe vazio para o padrão.' }
              - label: "Informações (lista)"
                name: meta
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: "Rótulo", name: label, widget: string, hint: "Ex.: Categorias" }
                  - { label: "Valor", name: value, widget: string, hint: "Ex.: Sub-15, Sub-17 e Sub-20" }
              - { label: "Parágrafos", name: paragraphs, widget: list, field: { label: "Parágrafo", name: p, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }, hint: "Cada item é um parágrafo da descrição. Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }

  # ===================================================================== FAQ
  - name: faq
    label: "❓ Perguntas Frequentes"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Perguntas Frequentes"
        file: "content/faq.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string }
          - label: "Perguntas e respostas"
            name: items
            widget: list
            label_singular: "Pergunta"
            summary: "{{fields.question}}"
            fields:
              - { label: "Pergunta", name: question, widget: string }
              - { label: "Resposta", name: answer, widget: markdown, minimal: true, buttons: [bold, italic, link], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }

  # ================================================================= HISTÓRIA
  - name: historia
    label: "📜 Nossa História"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Nossa História"
        file: "content/historia.yaml"
        fields:
          - label: "Topo da página (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string, hint: 'Ex.: Nossa' }
              - { label: "Palavra em vermelho", name: title_accent, widget: string, hint: 'Ex.: História' }
              - { label: "Frase abaixo", name: subtitle, widget: text }
              - { label: "Foto de fundo", name: image, widget: image }
          - { label: "Texto de introdução", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Parágrafo de abertura. Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - { label: "Título da linha do tempo", name: timeline_title, widget: string, hint: 'Ex.: Linha do Tempo' }
          - label: "Linha do tempo (conquistas)"
            name: timeline
            widget: list
            label_singular: "Marco"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Ano", name: year, widget: string, hint: "Ex.: 1932 ou 93 · 94 · 95" }
              - { label: "Título do marco", name: title, widget: string }
              - { label: "Descrição", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - label: "Destaque 1979 (faixa azul)"
            name: feature
            widget: object
            fields:
              - { label: "Etiqueta (em vermelho)", name: tag, widget: string, hint: 'Ex.: Auge nacional' }
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
              - label: "Mini-números"
                name: stats
                widget: list
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: "Número", name: number, widget: string, hint: "Ex.: 8 ou 26º" }
                  - { label: "Texto", name: label, widget: string, hint: "Ex.: Vitórias" }
          - label: "Blocos finais (Estádios, Torcida, etc.)"
            name: blocks
            widget: list
            label_singular: "Bloco"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título do bloco", name: title, widget: string }
              - { label: "Texto", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }

  # ================================================================== GALERIA
  - name: galeria
    label: "🖼️ Galeria"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Galeria de Fotos"
        file: "content/galeria.yaml"
        fields:
          - label: "Topo da página (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string, hint: 'Ex.: Galeria' }
              - { label: "Palavra em vermelho", name: title_accent, widget: string, hint: 'Ex.: MAC' }
              - { label: "Frase abaixo", name: subtitle, widget: text }
              - label: "Fotos que passam no topo"
                name: slides
                widget: list
                label_singular: "Foto"
                summary: "{{fields.src}}"
                thumbnail: "src"
                hint: "Cada item mostra a MINIATURA da foto atual."
                fields:
                  - { label: "Foto", name: src, widget: image }
          - { label: "Título da galeria", name: section_title, widget: string, hint: 'Ex.: Momentos' }
          - label: "Fotos da galeria"
            name: images
            widget: list
            label_singular: "Foto"
            summary: "{{fields.src}}"
            thumbnail: "src"
            hint: "Todas as fotos da grade. Cada item mostra a MINIATURA da foto atual — assim você vê exatamente qual está trocando. Arraste para reordenar."
            fields:
              - { label: "Foto", name: src, widget: image, hint: "Troque aqui: a miniatura ao lado é atualizada com a foto nova." }
              - { label: "Descrição da foto (opcional)", name: alt, widget: string, required: false, hint: "Ajuda a identificar a foto no painel e melhora a acessibilidade. Ex.: Comemoração do título de 2025." }

  # ================================================================ OUVIDORIA
  - name: ouvidoria
    label: "📨 Ouvidoria"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Ouvidoria"
        file: "content/ouvidoria.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string }
          - { label: "Parágrafos do texto", name: paragraphs, widget: list, field: { label: "Parágrafo", name: p, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }, hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - { label: "E-mail da ouvidoria", name: email, widget: string, hint: "Ex.: ouvidoria@seuclube.com.br" }

  # ==================================================================== TERMOS
  - name: termos
    label: "📄 Termos de Cotações"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Termos de Cotações"
        file: "content/termos.yaml"
        fields:
          - { label: "Título da página", name: title, widget: string }
          - label: "Itens / links"
            name: items
            widget: list
            label_singular: "Item"
            summary: "{{fields.label}}"
            fields:
              - { label: "Texto do link", name: label, widget: string }
              - { label: "Endereço (URL)", name: url, widget: string, hint: "Para onde o link leva. Use # se ainda não tiver." }

  # ================================================= TORCEDOR-CONSUMIDOR
  - name: torcedor
    label: "🎟️ Relacionamento com o Torcedor"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Relacionamento com o Torcedor-Consumidor"
        file: "content/torcedor.yaml"
        description: "Documento com as diretrizes de relacionamento com o público (estádio, ingressos, atendimento, redes, endereços e transparência). Os canais de atendimento, as redes sociais e o endereço da sede são puxados AUTOMATICAMENTE das abas 📞 Contato, 📨 Ouvidoria e ⚙️ Geral — não precisa digitar de novo aqui."
        fields:
          - { label: "Título da página", name: title, widget: string }
          - { label: "Subtítulo", name: subtitle, widget: string, hint: "Frase logo abaixo do título." }
          - { label: "Data de atualização", name: updated, widget: string, hint: "Ex.: Julho de 2026 — atualize sempre que mudar algo importante." }
          - { label: "Introdução", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
          - { label: "Fundamento legal (caixa azul)", name: basis, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "⚠️ Texto jurídico. Só altere com orientação do advogado do clube." }

          - label: "1. Acesso ao estádio"
            name: estadio
            widget: object
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto de abertura", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }
              - label: "Informações do estádio"
                name: facts
                widget: list
                label_singular: "Informação"
                summary: "{{fields.label}}: {{fields.value}}"
                hint: "Cada linha da tabela de informações (estádio, localização, capacidade, horários...)."
                fields:
                  - { label: "Rótulo", name: label, widget: string, hint: "Ex.: Capacidade" }
                  - { label: "Valor", name: value, widget: markdown, minimal: true, buttons: [bold], editor_components: [] }
              - { label: "Aviso (caixa vermelha)", name: note, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], required: false }

          - label: "2. Ingressos"
            name: ingressos
            widget: object
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto de abertura", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }
              - { label: "Onde comprar", name: where, widget: list, field: { label: "Local", name: item, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }, hint: "Cada item vira um tópico da lista." }
              - { label: "Título dos valores", name: prices_heading, widget: string }
              - { label: "Texto antes da tabela", name: prices_intro, widget: string }
              - label: "Tabela de valores"
                name: prices
                widget: list
                label_singular: "Setor"
                summary: "{{fields.sector}}"
                hint: "Cada item é uma linha da tabela de preços."
                fields:
                  - { label: "Setor", name: sector, widget: string, hint: "Ex.: Cadeira Coberta (MAC / Mista)" }
                  - { label: "Venda antecipada (secretaria)", name: advance, widget: string, hint: "Ex.: Inteira R$ 40 · Meia R$ 20" }
                  - { label: "No dia do jogo", name: matchday, widget: string, hint: "Ex.: Inteira R$ 60 · Meia R$ 30" }
              - { label: "Aviso sobre os valores (caixa vermelha)", name: prices_note, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "⚠️ IMPORTANTE: deve deixar claro que são valores de REFERÊNCIA e que mudam a cada jogo. Não remova este aviso." }
              - { label: "Título dos horários", name: hours_heading, widget: string }
              - label: "Horários de venda na secretaria"
                name: hours
                widget: list
                label_singular: "Horário"
                summary: "{{fields.day}}: {{fields.time}}"
                fields:
                  - { label: "Dia", name: day, widget: string, hint: "Ex.: Quinta e sexta-feira" }
                  - { label: "Horário", name: time, widget: string, hint: "Ex.: Manhã: 9h30 às 11h30 · Tarde: 15h às 17h30" }
              - { label: "Texto sobre meia-entrada", name: meia_note, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], required: false }

          - label: "3. Canais de atendimento"
            name: atendimento
            widget: object
            hint: "Telefone, e-mail, horário e Ouvidoria aparecem sozinhos (vêm das abas 📞 Contato e 📨 Ouvidoria). Aqui só os textos."
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto de abertura", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }
              - { label: "Aviso (caixa vermelha)", name: note, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], required: false }

          - label: "4. Redes sociais"
            name: redes
            widget: object
            hint: "Os links aparecem sozinhos (vêm da aba ⚙️ Geral). Aqui só os textos."
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto de abertura", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }

          - label: "5. Endereços físicos"
            name: enderecos
            widget: object
            hint: "O endereço da sede aparece sozinho (vem da aba 📞 Contato)."
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto de abertura", name: intro, widget: string }
              - { label: "Rótulo da sede", name: sede_label, widget: string, hint: "Ex.: Sede / Secretaria do MAC" }
              - { label: "Observação da sede", name: sede_note, widget: string, required: false }
              - label: "Outros endereços"
                name: items
                widget: list
                label_singular: "Endereço"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Rótulo", name: label, widget: string, hint: "Ex.: Estádio (mandante)" }
                  - { label: "Endereço", name: value, widget: markdown, minimal: true, buttons: [bold], editor_components: [] }
                  - { label: "Observação", name: note, widget: string, required: false }

          - label: "6. Transparência financeira"
            name: transparencia
            widget: object
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }
              - { label: "Texto do botão", name: cta_label, widget: string }
              - { label: "Link do botão", name: cta_url, widget: string, hint: "Deixe como transparencia.html" }

          - { label: "Observação final", name: footer_note, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], required: false }

  # ============================================ TRANSPARÊNCIA FINANCEIRA
  - name: transparencia
    label: "📊 Transparência Financeira"
    delete: false
    editor: { preview: false }
    files:
      - name: conteudo
        label: "Transparência Financeira"
        file: "content/transparencia.yaml"
        description: "Página onde ficam publicadas as demonstrações financeiras (balanços) do clube. Para publicar um balanço: adicione um item em 'Demonstrações financeiras', preencha o ano e o nome, e envie o PDF."
        fields:
          - { label: "Título da página", name: title, widget: string }
          - { label: "Subtítulo", name: subtitle, widget: string }
          - { label: "Data de atualização", name: updated, widget: string, hint: "Ex.: Julho de 2026" }
          - { label: "Introdução", name: intro, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }
          - { label: "Fundamento legal (caixa azul)", name: basis, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "⚠️ Texto jurídico. Só altere com orientação do advogado do clube." }
          - { label: "Título da lista", name: documents_heading, widget: string, hint: 'Ex.: Demonstrações financeiras' }
          - label: "Demonstrações financeiras (PDFs)"
            name: documents
            widget: list
            label_singular: "Documento"
            summary: "{{fields.year}} — {{fields.title}}"
            required: false
            hint: "Cada item vira um cartão com botão de download. Enquanto esta lista estiver vazia, o site mostra o aviso de 'em elaboração'."
            fields:
              - { label: "Ano (exercício)", name: year, widget: string, hint: "Ex.: 2024" }
              - { label: "Nome do documento", name: title, widget: string, hint: "Ex.: Demonstrações Financeiras — Exercício de 2024" }
              - { label: "Arquivo (PDF)", name: file, widget: file, hint: "Envie o PDF do balanço já auditado." }
              - { label: "Observação", name: note, widget: string, required: false, hint: "Linha pequena abaixo do nome. Ex.: Auditado por [empresa]. Deixe vazio para o texto padrão." }
          - { label: "Aviso quando não há documentos", name: documents_empty, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Aparece SÓ enquanto a lista acima estiver vazia." }
          - label: "Seções de texto"
            name: sections
            widget: list
            label_singular: "Seção"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Título da seção", name: heading, widget: string }
              - { label: "Texto", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [] }

