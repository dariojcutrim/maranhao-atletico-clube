              - { label: "Texto", name: text, widget: markdown, minimal: true, buttons: [bold, italic], editor_components: [], hint: "Destaques — AZUL: selecione e clique no N · VERMELHO: escreva ((palavra)) · PRETO: escreva [[palavra]]." }
