# Página Perguntas Frequentes (FAQ)
title: "Perguntas Frequentes"
items:
  - question: "Como faço para me tornar sócio do Maranhão Atlético Clube?"
    answer: "Você pode se associar pela página de Contatos ou diretamente na sede do clube. Em breve disponibilizaremos a adesão online com diferentes planos de sócio-torcedor."
  - question: "O MAC possui categorias de base?"
    answer: "Sim. O clube mantém categorias de base (Sub-15, Sub-17 e Sub-20) que revelam talentos do futebol maranhense. Saiba mais na página de Projetos."
  - question: "Como acontecem as peneiras / testes para atletas?"
    answer: "As datas de avaliação são divulgadas nas redes sociais oficiais e no site. Fique atento à seção de notícias e ao nosso Instagram."
  - question: "Como minha empresa pode patrocinar o clube?"
    answer: "Temos diferentes cotas de patrocínio e parceria. Entre em contato pela página de Contatos e nossa diretoria apresentará as oportunidades disponíveis."
  - question: "Onde compro ingressos para os jogos?"
    answer: "Os pontos de venda e valores são divulgados antes de cada partida nos canais oficiais do clube."
  - question: "O clube desenvolve projetos sociais?"
    answer: 'Sim. O projeto "MAC na Comunidade" leva o esporte a crianças e jovens, usando o futebol como ferramenta de inclusão e cidadania.'
  - question: "Como faço uma reclamação, sugestão ou elogio?"
    answer: "Utilize nossa Ouvidoria, um canal direto entre o torcedor/associado e a diretoria do clube."
