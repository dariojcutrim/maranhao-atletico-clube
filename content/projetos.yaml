title: Projetos
items:
  - title: Formação de Atletas
    image: /Imagens MAC/WhatsApp Image 2026-08-06 at 01.43.37.jpeg
    image_alt: Categoria de base do MAC
    reverse: false
    image_position: ''
    meta:
      - label: Categorias
        value: Sub-15, Sub-17 e Sub-20
      - label: Período
        value: Temporada 2026
      - label: Local
        value: Boleirinhos FC
    paragraphs:
      - Projeto que viabiliza a formação de jovens atletas maranhenses, oferecendo estrutura de treino, acompanhamento técnico, médico e educacional.
      - O projeto contempla a manutenção do centro de treinamento, contratação de comissão técnica especializada, aquisição de materiais esportivos, transporte e logística para as competições estaduais e nacionais de base.
  - title: Temporada Profissional
    image: /Imagens MAC/WhatsApp Image 2026-08-06 at 01.45.17.jpeg
    image_alt: Equipe Profissional 2026
    reverse: true
    image_position: ''
    meta:
      - label: Competições
        value: Campeonato Maranhense, Copa do Nordeste, Copa do Brasil e Campeonato Brasileiro Serié C
      - label: Período
        value: Janeiro a Agosto de 2026
      - label: Local
        value: São Luís / MA
    paragraphs:
      - Projeto que viabiliza a participação da equipe profissional do Maranhão Atlético Clube nas principais competições do calendário estadual, regional e nacional.
      - Contempla a montagem do elenco, comissão técnica, infraestrutura de jogos e treinos, serviços de logística e transporte, materiais esportivos e ações de relacionamento com a torcida.
  - title: MAC na Comunidade
    image: /Imagens MAC/WhatsApp Image 2026-08-06 at 01.48.22.jpeg
    image_alt: Projeto social do MAC
    reverse: false
    image_position: center 18%
    meta:
      - label: Público
        value: Crianças e Adolescentes
      - label: Período
        value: Ações contínuas
      - label: Local
        value: Bairros de São Luís
    paragraphs:
      - Projeto social que leva o esporte a crianças e jovens da comunidade, utilizando o futebol como ferramenta de inclusão, cidadania e desenvolvimento.
      - Inclui escolinhas gratuitas, doação de materiais esportivos e atividades educativas, fortalecendo o vínculo do clube com a comunidade maranhense.
