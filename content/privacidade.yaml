# Página Política de Privacidade (LGPD)
title: "Política de Privacidade"
updated: "Junho de 2026"
intro: "O [[Maranhão Atlético Clube]] respeita a sua privacidade e está comprometido com a proteção dos seus dados pessoais, em conformidade com a Lei Geral de Proteção de Dados (LGPD – Lei nº 13.709/2018). Esta política explica como tratamos as informações coletadas neste site."
sections:
  - heading: "Quais dados coletamos"
    text: "Coletamos apenas os dados que você nos fornece voluntariamente ao preencher os formulários de [[Contato]] e [[Ouvidoria]]: nome, e-mail, telefone/WhatsApp e a mensagem enviada. Não coletamos dados sensíveis."
  - heading: "Como usamos seus dados"
    text: "Utilizamos os dados exclusivamente para responder à sua mensagem, prestar atendimento e dar andamento à sua solicitação. Não usamos seus dados para envio de propaganda sem autorização."
  - heading: "Compartilhamento de dados"
    text: "Não vendemos nem compartilhamos seus dados pessoais com terceiros, exceto quando necessário para responder à sua solicitação ou por obrigação legal."
  - heading: "Seus direitos"
    text: "Você pode solicitar a qualquer momento o acesso, a correção ou a exclusão dos seus dados, bem como informações sobre como eles são tratados. Basta entrar em contato pelos nossos canais oficiais."
  - heading: "Contato"
    text: "Para qualquer dúvida sobre esta política ou sobre seus dados, fale com a gente pela página de Contato ou pela Ouvidoria do clube."
