title: "Transparência Financeira"
subtitle: "Demonstrações financeiras e mecanismos de transparência do Maranhão Atlético Clube"
updated: "Julho de 2026"

intro: "O **Maranhão Atlético Clube** disponibiliza nesta página suas demonstrações financeiras e as informações sobre a sua gestão, com acesso **livre e gratuito** a torcedores, sócios, fornecedores e demais interessados."

basis: "As demonstrações financeiras do clube são elaboradas nos termos do **art. 46-A da Lei Pelé** (Lei nº 9.615/1998) e submetidas a **auditoria independente**. A partir do exercício de 2024, são publicadas nesta página até o **último dia útil de abril** do ano seguinte e permanecem disponíveis para consulta pelo prazo mínimo de **três meses**."

documents_heading: "Demonstrações financeiras"

