documents: []

documents_empty: "As demonstrações financeiras do clube estão em processo de elaboração e auditoria independente. Assim que concluídas, serão publicadas nesta página e ficarão disponíveis para consulta e download."

sections:
  - heading: "O que é publicado"
    text: "As demonstrações financeiras reúnem as **receitas e despesas** relacionadas à atividade esportiva do clube, o resultado do exercício e a posição patrimonial, acompanhadas do parecer da **auditoria independente**."
  - heading: "Pedidos de informação"
    text: "Qualquer torcedor ou interessado pode pedir esclarecimentos sobre as informações publicadas aqui pela **Ouvidoria** do clube. As manifestações são encaminhadas ao setor responsável, que presta os esclarecimentos necessários."
