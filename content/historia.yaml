blocks:
  - title: Estádios
    text: O MAC manda a maior parte de seus jogos no [[Estádio Nhozinho Santos]] e utiliza o [[Castelão]] nas partidas de maior demanda — ambos em São Luís.
  - title: Torcida e Rivalidades
    text: O clube tem uma das maiores torcidas do estado e é apontado como o terceiro mais popular da capital, com rivalidades históricas contra [[Moto Club]] e [[Sampaio Corrêa]].
  - title: Quem somos hoje
    text: 'Tradição, camisa quadricolor e presença constante nas decisões. O Maranhão Atlético Clube segue como pilar do futebol maranhense: competitivo no estadual, ativo no calendário nacional e sustentado por uma torcida que atravessa gerações. É o MAC em campo — resistência, paixão e resultado, com história para contar e ambição para seguir crescendo.'
