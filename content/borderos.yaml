intro: 'O [[borderô]] é o documento oficial de cada partida: mostra o público presente, a receita de bilheteria, as despesas do jogo e o resultado final. O Maranhão Atlético Clube publica aqui os borderôs dos seus jogos, com acesso [[livre e gratuito]] a torcedores e demais interessados.'
