sobre:
  title: Sobre
  paragraphs:
    - Conhecido carinhosamente como [[Bode Gregório]], o Maranhão Atlético Clube é o quadricolor de São Luís e um dos maiores símbolos do futebol maranhense. Fundado em [[24 de setembro de 1932]], mostrou a que veio logo na estreia, goleando o ex-rival por 4 a 0 — o primeiro capítulo de uma história feita de tradição, raça e conquistas.
    - Do primeiro título estadual, em 1937, aos tricampeonatos e às taças mais recentes, o MAC ergueu um dos maiores acervos do estado — coroado pelo [[18º título maranhense em 2025]]. Pelo caminho, escreveu também páginas de protagonismo nacional, como a inesquecível campanha de 1979 na Primeira Divisão, quando [[superou gigantes como Fluminense, Bahia e Botafogo]].
    - 'Mandante no Estádio Nhozinho Santos e no Castelão nos grandes jogos, o Maranhão é movido por uma das maiores torcidas do estado, que atravessa gerações e mantém viva a paixão pelo quadricolor. Tradição em campo, resistência na arquibancada e ambição para seguir crescendo: esse é o [[Machão da Ilha]].'
